<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Keuangan Ojol</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Catatan Keuangan Ojol</h1>
      <p>Catat pemasukan dan pengeluaran harian dengan sederhana.</p>
    </header>

    <section class="summary">
      <div class="summary-card">
        <span>Pemasukan Hari Ini</span>
        <strong id="incomeTotal">Rp0</strong>
      </div>
      <div class="summary-card">
        <span>Pengeluaran Hari Ini</span>
        <strong id="expenseTotal">Rp0</strong>
      </div>
      <div class="summary-card net">
        <span>Pendapatan Bersih Hari Ini</span>
        <strong id="netTotal">Rp0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Masukkan Transaksi</h2>
      <form id="transactionForm">
        <label for="date">Tanggal</label>
        <input type="date" id="date" required>

        <label for="type">Tipe transaksi</label>
        <select id="type" required>
          <option value="pemasukan">Pemasukan</option>
          <option value="pengeluaran">Pengeluaran</option>
        </select>

        <label for="category">Kategori</label>
        <select id="category" required></select>

        <label for="amount">Nominal (Rp)</label>
        <input type="number" id="amount" min="1" step="1" placeholder="Contoh: 50000" required>

        <label for="note">Catatan (opsional)</label>
        <input type="text" id="note" placeholder="Contoh: bensin atau order pagi">

        <button type="submit">Tambah Transaksi</button>
        <p id="formMessage" class="message" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <div class="history-heading">
        <h2>Riwayat Transaksi</h2>
        <button type="button" id="clearButton" class="secondary">Hapus Semua</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Tipe</th>
              <th>Kategori</th>
              <th>Nominal</th>
              <th>Catatan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionList"></tbody>
        </table>
      </div>
      <p id="emptyMessage">Belum ada transaksi.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
